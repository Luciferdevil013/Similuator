id: gnss_inconsistency
description: >
  A position offset is applied to the GNSS measurement while the receiver
  continues to report a small covariance. The offset ramps in over 12 s so it
  cannot be caught by a single-epoch chi-square gate alone -- the windowed NIS
  and CUSUM drift detectors have to find it.

  This is NOT a claim about spoofing. It reproduces the measurement signature
  of an inconsistent position solution, which multipath and ephemeris error can
  also produce.
