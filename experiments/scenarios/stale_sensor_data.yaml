id: stale_sensor_data
description: >
  The GNSS driver wedges: it keeps publishing at the right rate with
  advancing timestamps, but the payload never changes. A plain
  "did a message arrive recently" check sees a healthy stream, so this is
  caught by payload-fingerprint comparison.
