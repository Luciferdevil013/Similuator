id: combined_stress
description: >
  Several faults in sequence on one route: an unmapped obstacle, a GNSS
  outage, a ramped GNSS inconsistency after the fix returns, and a LiDAR
  dropout. Tests that the state machine sequences correctly and that detection
  of one fault does not mask another.
seed: 12345
duration: 420.0
physics_dt: 0.0025
detail: nav
record_rate: 20.0

world:
  size_x: 200.0
  size_y: 200.0
  resolution: 0.5
  relief: 14.0
  octaves: 6
  ridge_mix: 0.35
  max_slope_deg: 25.0
  costmap_resolution: 0.75
  n_obstacles: 45
  keep_clear: 7.0
  origin_lla: [47.3977, 8.5456, 488.0]
  magnetic:
    declination_deg: 2.9
    inclination_deg: 63.1
    intensity_nt: 48500.0

mission:
  start: [12.0, 12.0]
  goal: [185.0, 185.0]
  goal_tolerance: 2.5
  timeout_s: 420.0

vehicle:
  robot_radius: 0.45
  params: {}

sensors:
  imu: {rate_hz: 200.0}
  gnss: {rate_hz: 5.0}
  wheel_odom: {rate_hz: 50.0}
  magnetometer: {rate_hz: 50.0}
  barometer: {rate_hz: 50.0}
  battery: {rate_hz: 5.0}
  lidar: {rate_hz: 10.0}

faults:
  - type: OBSTACLE_APPEARS
    target: world
    onset: 45.0
    duration: -1.0
    params: {kind: cylinder, x: 70.0, y: 70.0, radius: 1.7, height: 2.4}
    label: unmapped obstacle
  - type: GNSS_OUTAGE
    target: gnss
    onset: 95.0
    duration: 55.0
    label: fix lost
  - type: GNSS_INCONSISTENCY
    target: gnss
    onset: 185.0
    duration: 70.0
    ramp: 10.0
    params: {offset: [7.0, 5.0, 0.0]}
    label: inconsistent fix after recovery
  - type: LIDAR_DROPOUT
    target: lidar
    onset: 265.0
    duration: 45.0
    label: scanner dropout late in route
